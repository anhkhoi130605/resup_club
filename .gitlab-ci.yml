stages:
  - build

build_frontend:
  stage: build
  tags:
    - windows
  script:
    - echo "--- Đang build Frontend ---"
    - cd Front-End-ReactJS
    - npm install
    - npm run build

build_backend:
  stage: build
  tags:
    - windows
  script:
    - echo "--- Đang build Backend ---"
    - cd "Back-End-ASP.Net/ResUpClub.API"
    # Dùng đúng tên file .sln từ ảnh chụp màn hình của bạn
    - dotnet build "ResUpClubWebAPI.sln" --configuration Release