stages:
  - build
  - test
  - package
  - deploy

# ============== BACKEND BUILD ==============
build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "📦 Building .NET Backend..."
    - cd Back-End-ASP.Net/ResUpClub.API
    - dotnet restore
    - dotnet build "ResUpClubWebAPI.sln" --configuration Release
  artifacts:
    paths:
      - Back-End-ASP.Net/ResUpClub.API/bin/Release/
    expire_in: 30 days
  cache:
    paths:
      - Back-End-ASP.Net/**/bin/
      - Back-End-ASP.Net/**/obj/
  rules:
    - changes:
        - Back-End-ASP.Net/**/*

# ============== BACKEND TEST ==============
test_backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "🧪 Running Backend Tests..."
    - cd Back-End-ASP.Net/ResUpClub.API
    - dotnet test --no-build --verbosity normal
  dependencies:
    - build_backend
  rules:
    - changes:
        - Back-End-ASP.Net/**/*

# ============== FRONTEND BUILD ==============
build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - echo "📦 Building React Frontend..."
    - cd Front-End-ReactJS
    - npm install
    - npm run build
  artifacts:
    paths:
      - Front-End-ReactJS/dist/
    expire_in: 30 days
  cache:
    paths:
      - Front-End-ReactJS/node_modules/
  rules:
    - changes:
        - Front-End-ReactJS/**/*

# ============== FRONTEND TEST ==============
test_frontend:
  stage: test
  image: node:20-alpine
  script:
    - echo "🧪 Running Frontend Tests..."
    - cd Front-End-ReactJS
    - npm install
    # Thêm test script vào package.json nếu có
    # - npm run test
  dependencies:
    - build_frontend
  rules:
    - changes:
        - Front-End-ReactJS/**/*

# ============== DOCKER BUILD & PUSH ==============
docker_backend:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "🐳 Building Backend Docker Image..."
    - docker build -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA Back-End-ASP.Net/ResUpClub.API
    - docker tag $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/api:latest
    # Nếu có Docker registry, uncomment dòng dưới
    # - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA
    # - docker push $CI_REGISTRY_IMAGE/api:latest
  only:
    - main
    - develop

docker_frontend:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "🐳 Building Frontend Docker Image..."
    - docker build -t $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA Front-End-ReactJS
    - docker tag $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/web:latest
    # Nếu có Docker registry, uncomment dòng dưới
    # - docker push $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA
    # - docker push $CI_REGISTRY_IMAGE/web:latest
  only:
    - main
    - develop

# ============== DEPLOY ==============
deploy_development:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Deploying to Development..."
    # Thêm script deploy của bạn tại đây
  environment:
    name: development
    url: https://dev.resupclub.com
  only:
    - develop

deploy_production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Deploying to Production..."
    # Thêm script deploy của bạn tại đây
  environment:
    name: production
    url: https://resupclub.com
  only:
    - main
  when: manual