stages:
  - build

build_frontend:
  stage: build
  tags:
    - windows  
  script:
    - cd Front-End-ReactJS
    - npm install 
    - npm run build
  rules:
    - changes:
        - Front-End-ReactJS/**/*

build_backend:
  stage: build
  tags:
    - windows  
  script:
    - cd Back-End-ASP.Net/ResUpClub.API
    - dotnet build "ResUpClub.sln"
  rules:
    - changes:
        - Back-End-ASP.Net/**/*