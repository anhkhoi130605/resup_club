stages:
  - build

# Thiết lập chung cho tất cả các job để đảm bảo Runner luôn ở đúng thư mục
before_script:
  - echo "--- Thiết lập môi trường ---"

build_frontend:
  stage: build
  tags:
    - windows
  script:
    - echo "--- Bắt đầu Build Frontend ---"
    # Dùng đường dẫn đầy đủ từ thư mục gốc của project mà Runner đã clone
    - Set-Location -Path "Front-End-ReactJS"
    - npm install
    - npm run build

build_backend:
  stage: build
  tags:
    - windows
  script:
    - echo "--- Bắt đầu Build Backend ---"
    - Set-Location -Path "Back-End-ASP.Net/ResUpClub.API"
    - dotnet build "ResUpClubWebAPI.sln" --configuration Release