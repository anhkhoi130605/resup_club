stages:
  - build
default:
  tags:
    - windows

build_frontend:
  stage: build
  script:
    - cd Front-End-ReactJS
    - npm install
    - npm run build
  rules:
    - changes:
        - Front-End-ReactJS/**/*

build_backend:
  stage: build
  script:
    - cd Back-End-ASP.Net
    - dotnet build
  rules:
    - changes:
        - Back-End-ASP.Net/**/*
        