stages:
  - build

build_frontend:
  stage: build
  tags:
    - windows
  script:
    - echo "--- Ép npm chạy đúng thư mục ---"
    - npm --prefix Front-End-ReactJS install
    - npm run build --prefix Front-End-ReactJS

build_backend:
  stage: build
  tags:
    - windows
  script:
    - echo "--- Build Backend ---"
    - cd Back-End-ASP.Net/ResUpClub.API
    - dotnet build "ResUpClubWebAPI.sln" --configuration Release