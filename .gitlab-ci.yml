stages:
  - build
  
default:
  tags:
    - windows

build_frontend:
  stage: build
  script:
    - cd Front-End-ReactJS
    - npm install
    - npm run build
  only:
    changes:
      - Front-End-ReactJS/**/*

build_backend:
  stage: build
  script:
    - cd Back-End-ASP.Net/ResUpClub.API
    - dotnet build "ResUpClub.sln" 
  only:
    changes:
      - Back-End-ASP.Net/**/*